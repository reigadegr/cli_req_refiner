# 负载均衡配置示例
# upstream可以写很多组，api_keys可以写很多个
# 负载均衡策略：先轮询选择 upstream，再轮询选择 api_key
# 修改立即生效，如果不生效请反馈

[server]
# 服务监听端口
port = 9077
# 强制轮询的 upstream 下标列表；非空时忽略 enable 字段，仅在列表内轮询；空数组按默认规则轮询
force_upstream_index = []

# 是否打印请求体
log_req_body = false
# 是否打印响应体
log_res_body = false
# Claude 接口（Anthropic 模式）专属 User-Agent
user_agent_global_claude = "Claude-Code/1.0.84 (Linux; Android 14)"
# Codex 接口（OpenAI Responses 模式）专属 User-Agent
user_agent_global_codex = "Codex/0.31.0 (Linux; Android 14)"

# Upstream 1: 智谱 AI Anthropic 兼容接口
[[upstream]]
enable = true
name = "zhipu-main"
base_url = "https://open.bigmodel.cn/api/anthropic"
# model 支持单个字符串或数组；数组形式可实现模型级故障转移：
# 当第一个模型访问出错时，休眠后自动重试第二个模型，以此类推。
# 全部轮询完毕后回到第一个模型继续尝试；任一模型成功响应后，下次请求从第一个模型开始。
model = ["glm-4.7", "glm-4.6"]
api_keys = ["your_api_key1", "your_api_key2"]
# Claude 请求命中该 upstream 时使用
user_agent_claude = "Claude-Code/1.0.84 (Linux; Android 14)"
# Codex 请求命中该 upstream 时使用
user_agent_codex = "Codex/0.31.0 (Linux; Android 14)"
# mode 默认为 "anthropic"，也支持数组，例如 ["anthropic", "openai_responses"]
# 设置 enable = false 可临时禁用该 upstream
# 如需同时兼容多种协议，可设置 mode = ["anthropic", "openai_responses"]

# Upstream 2: 可配置更多 upstream 实现负载均衡
# [[upstream]]
# enable = true
# base_url = "https://another-provider.com/api/anthropic"
# model = "claude-3-5-sonnet-20241022"
# api_keys = ["your_key"]
# user_agent_claude = "Claude-Code/1.0.84 (Linux; Android 14)"
# user_agent_codex = "Codex/0.31.0 (Linux; Android 14)"
# mode = ["anthropic", "openai_responses"]  # 可选: "anthropic" | "openai_responses" | "openai_chat"
# openai_chat 暂未适配

[optimizations]
enable_network_probe_mock = true
enable_fast_prefix_detection = true
enable_historical_analysis_mock = true
enable_title_generation_skip = true
enable_suggestion_mode_skip = true
enable_filepath_extraction_mock = true
enable_strip_billing_header = true
